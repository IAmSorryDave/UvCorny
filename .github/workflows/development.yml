name: Tag Development Cycle 🛠️
on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  increment:
    if: github.event.commits != null && github.event.head_commit.author.name != 'GitHub Actions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check pyproject.toml Existence
        id: check_pyproject_file
        uses: andstor/file-existence-action@v3
        with:
          files: "pyproject.toml"

      - name: Install UV
        if: steps.check_pyproject_file.outputs.files_exists == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Format UV Version
        id: format
        shell: bash
        run: |
          CURRENT_VERSION=$(uv version --short)
          MAJOR=${CURRENT_VERSION:0:1}
          MINOR=$(find ./tests -maxdepth 1 -mindepth 1 -type d | wc -l)
          PATCH=${CURRENT_VERSION:4:1}
          VERSION="${MAJOR}.${MINOR}.${PATCH}.dev1"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
    
      - name: Sync Semver
        shell: bash
        run: |
          echo ${{ steps.format.outputs.version }}
          uv version ${{ steps.format.outputs.version }}

      - name: Verify Version Changed
        run: git diff --exit-code pyproject.toml || echo "Version updated successfully"

      - name: Commit & Push Version Change
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: development
          commit_message: "chore: bump development version to ${{ steps.format.outputs.version }}"
          file_pattern: pyproject.toml
