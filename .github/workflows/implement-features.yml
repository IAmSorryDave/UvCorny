name: Add ➕ Feature 🔧

on:
  pull_request:
    branches:
      - features
    types: closed

permissions:
  contents: write

jobs:

  increment:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
    
    - name: Checkout Project
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install UV
      uses: astral-sh/setup-uv@v7
    
    - name: Dry Run Version Increment
      run: |
        uv version --bump alpha --dry-run

    - name: Version Increment Alpha Alone
      run: |
        uv version --bump alpha
    
    - name: Verify Version Changed
      run: git diff --exit-code pyproject.toml || echo "Version updated successfully"

    - name: Increment Alpha Version
      id: version
      shell: bash
      run: |
        VERSION=$(uv version)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Commit & Push Version Change
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        branch: features
        commit_message: "chore: bump features version to ${{ steps.version.outputs.version }}"
        file_pattern: pyproject.toml
        commit_user_name: ${{ github.event.pull_request.merged_by.login }}
        commit_user_email: ${{ github.event.pull_request.merged_by.id }}+${{ github.event.pull_request.merged_by.login }}@users.noreply.github.com
        commit_author: "${{ github.event.pull_request.merged_by.login }} <${{ github.event.pull_request.merged_by.id }}+${{ github.event.pull_request.merged_by.login }}@users.noreply.github.com>"

  implement:
    name: Implement Merged Features
    needs: increment
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Features Branch
        uses: actions/checkout@v7
        with:
          ref: features
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Install Pre-Commit
        run: uv tool install pre-commit --with pre-commit-uv --force-reinstall

      - name: Append Project Requirements to Pytest Hook
        run: |
          sudo apt-get update
          sudo apt-get install -y yq
          bash .scripts/bash/pre-commit/append_requirements.bash
          sudo apt-get purge -y yq

      - name: Run Implementation Pre-Commit Hook
        run: pre-commit run --config .hooks/system/.pre-commit-config.yaml --hook-stage manual manage-subagents-run-implementation --all-files
        env:
          IMPLEMENTATION_SUBAGENT_PROVIDER_BASE_URL: ${{ secrets.IMPLEMENTATION_SUBAGENT_PROVIDER_BASE_URL }}
          IMPLEMENTATION_SUBAGENT_PROVIDER_API_KEY: ${{ secrets.IMPLEMENTATION_SUBAGENT_PROVIDER_API_KEY }}

      - name: Run Pytest Pre-Commit Hook
        run: pre-commit run --config .hooks/system/.pre-commit-config.yaml --hook-stage manual pytest --all-files

      - name: Commit & Push Implementation
        shell: bash
        run: |
          git config user.name "$MERGED_BY_LOGIN"
          git config user.email "${MERGED_BY_ID}+${MERGED_BY_LOGIN}@users.noreply.github.com"
          git add -- src/ README.md.jinja
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat: implement merged feature requirements"
          git push origin HEAD:features
        env:
          MERGED_BY_LOGIN: ${{ github.event.pull_request.merged_by.login }}
          MERGED_BY_ID: ${{ github.event.pull_request.merged_by.id }}
  
