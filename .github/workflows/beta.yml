name: Release Beta 🍏

on:
  push:
    branches: [beta]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Validate Features Branch ✅
    runs-on: ubuntu-latest
      
    steps:
    
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"
      
      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Install YQ && Append Requirements to pre-commit Pytest Hook
        id: append_requirements
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y yq && ${PWD}/.sh/scripts/append_requirements.sh && sudo apt purge -y yq

      - name: Install Pre-Commit
        run: uv tool install pre-commit --with pre-commit-uv --force-reinstall

      - name: Install Hooks
        run: pre-commit install

      - name: Run Tests
        run: pre-commit run pytest --all-files

      - name: Clean Up
        run: pre-commit uninstall

  handle-test-failure:
    needs: test
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup UV
        uses: astral-sh/setup-uv@v7

      - name: Fetch Development Branch
        shell: bash
        run: git fetch origin development:development

      - name: Checkout Development Branch
        shell: bash
        run: git checkout development

      - name: Dry Run Version Increment
        run: |
          uv version --bump patch --bump dev --dry-run
  
      - name: Version Increment Dev Alone
        run: |
          uv version --bump patch --bump dev

      - name: Verify Version Changed
        run: git diff --exit-code pyproject.toml || echo "Version updated successfully"

      - name: Increment Patch & Dev Version
        id: version
        shell: bash
        run: |
          VERSION=$(uv version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit & Push Version Change
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: merge from beta with patch and dev version bump to ${{ steps.version.outputs.version }}"
          file_pattern: pyproject.toml
          push_options: --force

  increment:
      needs: test
      runs-on: ubuntu-latest
      if: success()
      steps:
        - name: Checkout Code
          uses: actions/checkout@v6
          with:
            token: ${{ secrets.GITHUB_TOKEN }}
  
        - name: Setup UV
          uses: astral-sh/setup-uv@v7

        - name: Dry Run Version Increment
          run: |
            uv version --bump beta --dry-run
  
        - name: Version Increment Dev Alone
          run: |
            uv version --bump beta
  
        - name: Verify Version Changed
          run: git diff --exit-code pyproject.toml || echo "Version updated successfully"
  
        - name: Increment Beta Version
          id: version
          shell: bash
          run: |
            VERSION=$(uv version)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
  
        - name: Commit & Push Version Change
          uses: stefanzweifel/git-auto-commit-action@v7
          with:
            commit_message: "chore: bump beta version to ${{ steps.version.outputs.version }}"
            file_pattern: pyproject.toml

