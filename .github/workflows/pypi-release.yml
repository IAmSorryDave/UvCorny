
name: PyPI Production Release 🐍

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  id-token: write

jobs:

  build:
    if: github.event.pull_request.merged == true
    name: Build Distribution 📦; Cache Distribution ⬆️
    runs-on: ubuntu-latest
    outputs:
      release_candidate: ${{ steps.check_version.outputs.release_candidate }}
    permissions:
      contents: write

    steps:

      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Check Current Version
        id: check_version
        shell: bash
        run: |
          CURRENT_VERSION=$(uv version --short)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          if [[ "$CURRENT_VERSION" == "*rc*" ]]; then
            echo "release_candidate=true" >> $GITHUB_OUTPUT
          else
            echo "release_candidate=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Dry Run Stable Version Increment
        if: steps.check_version.outputs.release_candidate == 'true'
        run: |
          uv version --bump stable --dry-run

      - name: Stable Version Increment
        if: steps.check_version.outputs.release_candidate == 'true'
        run: |
          uv version --bump stable 

      - name: Verify Version Changed
        if: steps.check_version.outputs.release_candidate == 'true'
        run: git diff --exit-code pyproject.toml || echo "Version updated successfully"

      - name: Dry Run Major Version Increment
        if: steps.check_version.outputs.release_candidate == 'true'
        run: |
          uv version --bump major --dry-run

      - name: Major Version Increment
        if: steps.check_version.outputs.release_candidate == 'true'
        run: |
          uv version --bump major

      - name: Verify Version Changed
        if: steps.check_version.outputs.release_candidate == 'true'
        run: git diff --exit-code pyproject.toml || echo "Version updated successfully"

      - name: Build Distribution
        run: uv build

      - name: Store Distribution Packages
        uses: actions/upload-artifact@v7
        with:
          name: pypi-python-package-distributions
          path: dist/
          if-no-files-found: error
          overwrite: 'true'
          retention-days: 1

  publish-to-pypi:
    name: Publish Python 🐍 Distribution 📦 to PyPi
    needs: build
    runs-on: ubuntu-latest
    outputs:
      release_candidate: ${{ needs.build.outputs.release_candidate }}
    environment:
      name: pypi
      url: https://pypi.org/p/${{ steps.repo_name.outputs.name }}

    permissions: write-all

    steps:

    - name: Set Lowercase Repository Name
      id: repo_name
      run: echo "name=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Download Distribution Packages
      uses: actions/download-artifact@v8
      with:
        name: pypi-python-package-distributions
        path: dist/
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run_conclusion: success

    - name: Publish Distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  finalize:
    name: Increment Version ⬆️ and Issue Release
    runs-on: ubuntu-latest
    needs: publish-to-pypi
    outputs:
      release_candidate: ${{ needs.publish-to-pypi.outputs.release_candidate }}

    steps:

      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Dry Run Stable Version Increment
        if: needs.publish-to-pypi.outputs.release_candidate == 'true'
        run: |
          uv version --bump stable --dry-run

      - name: Stable Version Increment
        if: needs.publish-to-pypi.outputs.release_candidate == 'true'
        run: |
          uv version --bump stable 

      - name: Verify Version Changed
        if: needs.publish-to-pypi.outputs.release_candidate == 'true'
        run: git diff --exit-code pyproject.toml || echo "Version updated successfully"

      - name: Dry Run Major Version Increment
        if: needs.publish-to-pypi.outputs.release_candidate == 'true'
        run: |
          uv version --bump major --dry-run

      - name: Major Version Increment
        if: needs.publish-to-pypi.outputs.release_candidate == 'true'
        run: |
          uv version --bump major

      - name: Verify Version Changed
        run: git diff --exit-code pyproject.toml || echo "Version updated successfully"

      - name: Extract Version
        id: version
        shell: bash
        run: |
          VERSION=$( uv version )
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit & Push Version Change
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: "chore: bump version to ${{ steps.version.outputs.version }}"
  
  sync:
    name: Sync Hotfix Branch 🔄
    runs-on: ubuntu-latest
    needs: finalize
    permissions:
      contents: write

    steps:

      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Sync Hotfix Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin hotfix || git checkout --orphan hotfix
          git reset --hard main
          git push origin hotfix --force-with-lease

  cycle:
    name: Cycle Development 🔁 Version Bump ⬆️
    runs-on: ubuntu-latest
    needs: finalize
    permissions:
      contents: write

    steps:

      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Dry Run Minor & Dev Version Increment
        run: |
          uv version --bump minor --bump dev --dry-run

      - name: Minor Version Increment
        run: |
          uv version --bump minor --bump dev

      - name: Verify Version Changed
        run: git diff --exit-code pyproject.toml || echo "Version updated successfully"

      - name: Extract Version
        id: version
        shell: bash
        run: |
          VERSION=$( uv version )
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit & Push to Development
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: development
          push_options: '--force-with-lease'
          commit_message: "chore: cycle development version to ${{ steps.version.outputs.version }}"

  
  
