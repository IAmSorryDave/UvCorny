name: Test Hotfix Branch 🧯

on:
  pull_request:
    branches:
      -  hotfix
    types: opened

permissions:
  contents: write

jobs:
  test:
    name: Validate Hotfix ✅
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: hotfix

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"
      
      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Make Append Script Executable
        shell: bash
        run: chmod +x ${PWD}/scripts/pre-commit/append_requirements.bash

      - name: Install YQ && Append Requirements to pre-commit Pytest Hook
        id: append_requirements
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y yq && ${PWD}/scripts/pre-commit/append_requirements.bash && sudo apt purge -y yq

      - name: Install Pre-Commit
        run: uv tool install pre-commit --with pre-commit-uv --force-reinstall

      - name: Setup
        run: pre-commit install

      - name: Run Tests
        shell: bash
        run: source main.bash

      - name: Teardown
        run: pre-commit uninstall

  increment:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          ref: hotfix
  
      - name: Install UV
        uses: astral-sh/setup-uv@v7
      
      - name: Dry Run Version Increment
        run: |
          uv version --bump patch --dry-run

      - name: Version Increment
        run: |
          uv version --bump patch

      - name: Format UV Version
        id: format
        shell: bash
        run: |
          CURRENT_VERSION=$(uv version --short)
          MAJOR=${CURRENT_VERSION:0:1}
          MINOR=$(find ./tests -maxdepth 1 -mindepth 1 -type d | wc -l)
          PATCH=${CURRENT_VERSION:4:1}
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
    
      - name: Sync Semver
        shell: bash
        run: |
          echo ${{ steps.format.outputs.version }}
          uv version ${{ steps.format.outputs.version }}

      - name: Verify Version Changed
        run: git diff --exit-code pyproject.toml || echo "Version updated successfully"

      - name: Increment Release Candidate Version
        id: version
        shell: bash
        run: |
          VERSION=$(uv version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit & Push Version Change
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: hotfix
          commit_message: "chore: added patch; bump rc version to ${{ steps.version.outputs.version }}"
          file_pattern: pyproject.toml
